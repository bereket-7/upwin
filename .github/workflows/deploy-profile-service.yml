name: Staging Profile-Service

on:
  push:
    branches:
      - staging

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: |
          cd apps/profile-service
          npx prisma generate

      - name: Build Profile Service
        run: npx nx build profile-service

      - name: Verify Build Output
        run: |
          echo "=== Checking for dist folder ==="
          ls -la dist/apps/profile-service || echo "dist/apps/profile-service not found!"
          echo ""
          echo "=== Searching for any dist folders ==="
          find . -type d -name "dist" -o -name "build" 2>/dev/null || echo "No dist or build folders found"
          echo ""
          echo "=== Checking apps/profile-service directory ==="
          ls -la apps/profile-service/
          echo ""
          echo "=== Root directory contents ==="
          ls -la

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -f apps/profile-service/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/profile-service:staging .
          docker push ${{ secrets.DOCKER_USERNAME }}/profile-service:staging

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        run: |
          # Install sshpass for password-based SSH
          sudo apt-get update && sudo apt-get install -y sshpass

          # Deploy using SSH with password
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} << 'EOF'
            # Pull the new image
            docker pull ${{ secrets.DOCKER_USERNAME }}/profile-service:staging
            
            # Stop and remove the existing container if it exists
            docker stop profile-service-staging || true
            docker rm profile-service-staging || true
            
            # Run the new container with environment variables
            docker run -d \
              --restart always \
              -p 3009:3009 \
              --add-host host.docker.internal:host-gateway \
              --name profile-service-staging \
              -e 'PORT=3009' \
              -e 'NODE_ENV=production' \
              -e 'DATABASE_URL=${{ secrets.PROFILE_DATABASE_URL }}' \
              -e 'JWT_SECRET=${{ secrets.PROFILE_JWT_SECRET }}' \
              -e 'ALLOWED_ORIGINS=${{ secrets.PROFILE_ALLOWED_ORIGINS }}' \
              ${{ secrets.DOCKER_USERNAME }}/profile-service:staging
          EOF
