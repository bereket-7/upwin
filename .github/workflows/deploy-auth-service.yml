name: Staging Auth-Service

on:
  push:
    branches:
      - staging

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/auth-service/prisma/schema.prisma

      - name: Build Auth Service
        run: npx nx build auth-service --configuration=production

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify Build Output
        run: |
          echo "=== Checking for dist folder ==="
          ls -la dist/apps/auth-service || echo "dist/apps/auth-service not found!"
          echo ""
          echo "=== Searching for any dist folders ==="
          find . -type d -name "dist" -o -name "build" 2>/dev/null || echo "No dist or build folders found"
          echo ""
          echo "=== Checking apps/auth-service directory ==="
          ls -la apps/auth-service/
          echo ""
          echo "=== Root directory contents ==="
          ls -la

      - name: Build and Push Docker Image
        run: |
          docker build -f apps/auth-service/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/auth-service:staging .
          docker push ${{ secrets.DOCKER_USERNAME }}/auth-service:staging

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            # Pull the new image
            docker pull ${{ secrets.DOCKER_USERNAME }}/auth-service:staging

            # Stop and remove the existing container if it exists
            docker stop auth-service-staging || true
            docker rm auth-service-staging || true

            # Run the new container
            # Mapping Port 3008 (VPS) to 3008 (Container)
            # Setting PORT=3008 env var to ensure NestJS listens on it
            docker run -d \
              --restart always \
              -p 3008:3008 \
              --name auth-service-staging \
              -e PORT=3008 \
              -e NODE_ENV=production \
              ${{ secrets.DOCKER_USERNAME }}/auth-service:staging
