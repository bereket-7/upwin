name: Deploy Auth Service to VPS

on:
  push:
    branches:
      - staging

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/auth-service/prisma/schema.prisma

      - name: Build Auth Service
        run: npx nx build auth-service --configuration=production

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/auth-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/auth-service:staging
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/auth-service:staging
          cache-to: type=inline

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            # Pull the new image
            docker pull ${{ secrets.DOCKER_USERNAME }}/auth-service:staging

            # Stop and remove the existing container if it exists
            docker stop auth-service-staging || true
            docker rm auth-service-staging || true

            # Run the new container
            # Mapping Port 3008 (VPS) to 3008 (Container)
            # Setting PORT=3008 env var to ensure NestJS listens on it
            docker run -d \
              --restart always \
              -p 3008:3008 \
              --name auth-service-staging \
              -e PORT=3008 \
              -e NODE_ENV=production \
              ${{ secrets.DOCKER_USERNAME }}/auth-service:staging
