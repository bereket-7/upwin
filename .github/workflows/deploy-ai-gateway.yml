name: Staging AI-Gateway

on:
  push:
    branches:
      - staging
    paths:
      - 'apps/ai-gateway/**'
      - 'libs/shared/**'
      - '.github/workflows/deploy-ai-gateway.yml'
  
  # Manual trigger option
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Shared Library
        run: node libs/shared/build.js

      - name: Build AI Gateway Service
        run: npx nx build ai-gateway --configuration=production

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify Build Output
        run: |
          echo "=== Checking ai-gateway build output ==="
          ls -la dist/apps/ai-gateway/ || echo "dist/apps/ai-gateway not found!"
          echo ""
          echo "=== Checking shared library ==="
          ls -la libs/shared/dist/ || echo "libs/shared/dist not found!"

      - name: Build and Push Docker Image
        run: |
          docker build -f apps/ai-gateway/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/ai-gateway:staging .
          docker push ${{ secrets.DOCKER_USERNAME }}/ai-gateway:staging

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        run: |
          # Install sshpass for password-based SSH
          sudo apt-get update && sudo apt-get install -y sshpass

          # Deploy using SSH with password
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} << 'EOF'
            # Pull the new image
            docker pull ${{ secrets.DOCKER_USERNAME }}/ai-gateway:staging
            
            # Stop and remove the existing container if it exists
            docker stop ai-gateway-staging || true
            docker rm ai-gateway-staging || true
            
            # Run the new container with environment variables
            docker run -d \
              --restart always \
              --network host \
              --name ai-gateway-staging \
              -e 'PORT=3007' \
              -e 'NODE_ENV=production' \
              -e 'QDRANT_URL=${{ secrets.QDRANT_URL }}' \
              -e 'QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY }}' \
              -e 'GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}' \
              -e 'JWT_SECRET=${{ secrets.JWT_SECRET }}' \
              -e 'ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}' \
              ${{ secrets.DOCKER_USERNAME }}/ai-gateway:staging
            
            # Wait for service to be ready
            echo "Waiting for ai-gateway to start..."
            sleep 15
            
            # Health check from host (using root endpoint)
            for i in {1..30}; do
              if curl -f http://localhost:3007/api 2>/dev/null; then
                echo "AI Gateway is healthy!"
                exit 0
              fi
              echo "Attempt $i: Service not ready yet..."
              sleep 2
            done
            
            echo "Service failed to start properly"
            docker logs --tail 50 ai-gateway-staging
            exit 1
          EOF
