# Nginx configuration for UPXL API Gateway
# Domain: upxl.sandbox.be.tibebai.com
# 
# Installation:
# 1. Copy to: /etc/nginx/sites-available/upxl-api
# 2. Enable: sudo ln -s /etc/nginx/sites-available/upxl-api /etc/nginx/sites-enabled/
# 3. Test: sudo nginx -t
# 4. Reload: sudo systemctl reload nginx

# Upstream definitions
upstream auth_service {
    server localhost:3008;
    keepalive 32;
}

upstream profile_service {
    server localhost:3009;
    keepalive 32;
}

upstream ai_gateway {
    server localhost:3007;
    keepalive 32;
}

upstream proposal_service {
    server localhost:3010;
    keepalive 32;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name upxl.sandbox.be.tibebai.com;
    
    # Allow Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name upxl.sandbox.be.tibebai.com;

    # SSL Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/upxl.sandbox.be.tibebai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/upxl.sandbox.be.tibebai.com/privkey.pem;
    
    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/upxl-api-access.log;
    error_log /var/log/nginx/upxl-api-error.log warn;

    # Client settings
    client_max_body_size 10M;
    client_body_timeout 60s;

    # Root health check
    location = /health {
        access_log off;
        return 200 '{"status":"healthy","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # Auth Service - /auth/*
    location /auth {
        rewrite ^/auth/(.*) /$1 break;
        rewrite ^/auth$ / break;
        
        proxy_pass http://auth_service;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
        
        # Buffering
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # Profile Service - /profile/*
    location /profile {
        rewrite ^/profile/(.*) /$1 break;
        rewrite ^/profile$ / break;
        
        proxy_pass http://profile_service;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # AI Gateway - /ai/*
    location /ai {
        rewrite ^/ai/(.*) /$1 break;
        rewrite ^/ai$ / break;
        
        proxy_pass http://ai_gateway;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Longer timeout for AI operations
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # Proposal Service - /proposal/*
    location /proposal {
        rewrite ^/proposal/(.*) /$1 break;
        rewrite ^/proposal$ / break;
        
        proxy_pass http://proposal_service;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # API documentation (if you add Swagger later)
    location /docs {
        return 200 '{"message":"API documentation coming soon"}';
        add_header Content-Type application/json;
    }
}
